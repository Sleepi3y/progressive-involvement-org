<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progressive Involvement Organization</title>

    <!-- 
        ============================================
        GOOGLE FONTS - Change fonts here if you want
        ============================================
        The design uses a bold, stencil-like font for headings.
        You can replace the font URLs below with any Google Font.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">

    <style>
        /* 
            ============================================
            COLOR VARIABLES - EDIT COLORS HERE
            ============================================
            Change these hex codes to rebrand the whole site.
        */
        :root {
            --dark-purple: #7B5EA7;       /* Header background */
            --medium-purple: ##745CBB;     /* Main text/accents */
            --light-purple: #C9B8E8;      /* Borders and light text */
            --very-light-purple: #D4C4E8; /* Footer background */
            --white: #FFFFFF;
        }

        /* Reset default browser margins/padding */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Playfair Display', serif;
            background-color: var(--white);
            color: var(--medium-purple);
        }

        /* 
            ============================================
            HEADER SECTION
            ============================================
            The purple bar at the top with the org name,
            logo, and mission statement.
        */
        header {
            background-color: var(--dark-purple);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 40px;
            min-height: 150px;
            position: relative;
        }

        /* Org name on the left side of header */
        .org-name {
            font-family: 'Anton', sans-serif;
            font-size: 2.2rem;
            line-height: 1.2;
            max-width: 300px;
            letter-spacing: 2px;
        }

        /* Logo in the center of header */
        .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            /* 
                REPLACE THE SRC IN THE HTML BELOW WITH YOUR OWN LOGO IMAGE.
                For now, this is a placeholder circle.
            */
        }

        .logo img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* Mission statement area on the right */
        .mission-area {
            max-width: 320px;
            <title>JOYMAXX</title>
        }

        .mission-area h2 {
            font-family: 'Anton', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        /* 
            ============================================
            MISSION BOX - SCROLLS UP AND DOWN
            ============================================
            This box moves with the user's scroll.
            We use "position: sticky" to make it float.
        */
        .mission-box {
            border: 3px solid var(--white);
            padding: 15px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            line-height: 1.4;
            position: sticky;
            top: 20px; /* How far from the top it sticks */
            background-color: var(--dark-purple);
        }

        /* 
            ============================================
            MAIN CONTENT AREA
            ============================================
        */
        main {
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Section titles */
        .section-title {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 900;
            color: var(--medium-purple);
            margin-bottom: 30px;
        }

        /* 
            ============================================
            NEWSLETTER GRID - TWO COLUMNS
            ============================================
            The "This week's news" section with two
            newsletter cards side by side.
        */
        .newsletter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Two equal columns */
            gap: 30px;
            margin-bottom: 40px;
        }

        /* Each newsletter card */
        .newsletter-card {
            border: 3px solid var(--light-purple);
            padding: 0;
        }

        /* The "Newsletter" label at the top of each card */
        .newsletter-card h3 {
            background-color: var(--white);
            color: var(--medium-purple);
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 900;
            padding: 10px 15px;
            border-bottom: 3px solid var(--light-purple);
        }

        /* The image placeholder area inside each card */
        .newsletter-image {
            height: 300px; /* Change this to adjust box height */
            display: flex;
            align-items: flex-start;
            padding: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--medium-purple);
        }

        /* 
            To add a real image, replace the text inside
            .newsletter-image with an <img> tag like:
            <img src="your-image.jpg" alt="Newsletter" style="width:100%; height:100%; object-fit:cover;">
        */

        /* Divider line between sections */
        .divider {
            border: none;
            border-top: 3px solid var(--light-purple);
            margin: 40px 0;
        }

        /* 
            ============================================
            UPCOMING EVENTS SECTION
            ============================================
        */
        .events-title {
            text-align: center;
            font-family: 'Anton', sans-serif;
            font-size: 3.5rem;
            color: var(--light-purple); /* Very light purple text */
            letter-spacing: 5px;
            margin-bottom: 30px;
        }

        .events-box {
            border: 3px solid var(--light-purple);
            height: 350px; /* Change this to adjust the box height */
            padding: 20px;
        }

        /* 
            ============================================
            FOOTER
            ============================================
            The light purple bar at the bottom with
            donations link and Instagram.
        */
        footer {
            background-color: var(--very-light-purple);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 40px;
        }

        footer a {
            color: var(--white);
            text-decoration: none;
            font-family: 'Anton', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 2px;
        }

        footer a:hover {
            text-decoration: underline;
        }

        .footer-instagram {
            font-family: 'Anton', sans-serif;
            font-size: 1.8rem;
            color: var(--white);
            letter-spacing: 3px;
        }

        /* 
            ============================================
            RESPONSIVE DESIGN - MOBILE FRIENDLY
            ============================================
            This makes the site look good on phones.
            You can adjust the breakpoint (768px) if needed.
        */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                text-align: center;
                gap: 15px;
                padding: 20px;
            }

            .org-name {
                max-width: 100%;
            }

            .mission-area {
                max-width: 100%;
            }

            .newsletter-grid {
                grid-template-columns: 1fr; /* Stack into one column on mobile */
            }

            .section-title {
                font-size: 2rem;
            }

            .events-title {
                font-size: 2rem;
            }

            footer {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- 
        ============================================
        HEADER
        ============================================
        Edit the org name, logo, and mission text below.
    -->
    <header>
        <!-- LEFT: Organization Name -->
        <!-- EDIT: Change "PROGRESSIVE INVOLVEMENT ORGANIZATION" to your org's name -->
        <div class="org-name">
            PROGRESSIVE<br>
            INVOLVEMENT<br>
            ORGANIZATION
        </div>
